<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Registro de Horas — Estações</title>
<style>
  :root{
    --bg: #14161a;
    --panel: #1c1f25;
    --panel-2: #22262d;
    --border: #2c3038;
    --text: #ece9e2;
    --muted: #8b8f98;
    --amber: #f0a537;
    --amber-dim: #6b4f1e;
    --teiji: #5fb88f;
    --zangyo: #e8734a;
    --danger: #d9524a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action: manipulation;
  }
  .app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  header{padding:16px 16px 12px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:10;}
  .clock{
    font-family: "SF Mono", "Courier New", monospace;
    font-variant-numeric: tabular-nums;
    font-size:40px; font-weight:700; letter-spacing:1px; color:var(--amber);
    line-height:1;
  }
  .header-row{display:flex; justify-content:space-between; align-items:flex-end;}
  .date-line{color:var(--muted); font-size:13px; margin-top:4px; text-transform:capitalize;}
  .reset-btn{background:none; border:1px solid var(--border); color:var(--muted); font-size:12px; font-weight:700;
    padding:8px 12px; border-radius:9px;}

  main{flex:1; padding:16px; padding-bottom:32px;}

  .section-label{font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:20px 0 10px;}
  .section-label:first-child{margin-top:0;}

  .stations-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .station-btn{
    aspect-ratio:1/0.85; border-radius:12px; border:2px solid var(--border);
    background:var(--panel); color:var(--text);
    font-size:17px; font-weight:800; letter-spacing:0.5px;
    display:flex; align-items:center; justify-content:center;
    text-align:center; line-height:1.2; padding:4px;
    position:relative; transition: all .15s ease;
  }
  .station-btn small{position:absolute; bottom:8px; font-size:10px; font-weight:500; color:var(--muted);}
  .station-btn.active{background:linear-gradient(180deg,#3a2c14,#2a2010); border-color:var(--amber); color:var(--amber);
    box-shadow: 0 0 0 3px rgba(240,165,55,0.15) inset;}
  .station-btn.pending{background:linear-gradient(180deg,#3a1f1a,#2a1512); border-color:var(--zangyo); color:var(--zangyo);}
  .station-btn:disabled{opacity:0.45;}

  .status-card{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px; margin-top:16px;}
  .status-row{display:flex; justify-content:space-between; align-items:baseline;}
  .status-row .label{color:var(--muted); font-size:13px;}
  .status-row .value{font-family:monospace; font-variant-numeric: tabular-nums; font-size:22px; font-weight:700;}
  .status-sub{color:var(--muted); font-size:12px; margin-top:6px;}

  .events-list{display:flex; flex-direction:column; gap:6px; max-height:220px; overflow-y:auto;}
  .event-row{display:flex; justify-content:space-between; align-items:center; background:var(--panel);
    border:1px solid var(--border); border-radius:9px; padding:9px 12px; font-size:13.5px; flex-wrap:wrap; row-gap:6px;}
  .event-row .ev-station{font-weight:800; color:var(--amber); min-width:34px;}
  .event-row .ev-time{font-family:monospace; color:var(--text);}
  .event-row.ev-final{border-color:var(--teiji);}
  .event-row.ev-final .ev-station{color:var(--teiji);}
  .empty-msg{color:var(--muted); font-size:13px; text-align:center; padding:16px 0;}
  .mini-duration-input{
    width:30px; padding:4px 2px; font-size:12.5px; font-weight:700; text-align:center;
    background:var(--bg); border:1px solid var(--amber); color:var(--amber); border-radius:5px;
    font-family:monospace; -moz-appearance:textfield;
  }
  .mini-duration-input::-webkit-outer-spin-button, .mini-duration-input::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }

  table.totals{width:100%; border-collapse:collapse; margin-top:6px;}
  table.totals th{text-align:left; font-size:11px; text-transform:uppercase; color:var(--muted); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--border);}
  table.totals td{padding:9px 8px; border-bottom:1px solid var(--border); font-size:14px;}
  table.totals td.station-cell{font-weight:800; color:var(--amber);}
  table.totals td.teiji-cell{color:var(--teiji); font-family:monospace;}
  table.totals td.zangyo-cell{color:var(--zangyo); font-family:monospace;}
  table.totals td.total-cell{font-family:monospace; font-weight:700;}
  table.totals tr.grand td{border-top:2px solid var(--border); border-bottom:none; font-weight:800; padding-top:12px;}
  table.totals tr.subtotal td{border-top:1px dashed var(--border); font-style:italic; color:var(--muted);}
  table.totals tr.subtotal td.station-cell{color:var(--muted);}

  .actions{display:flex; gap:10px; margin-top:18px;}
  .btn{flex:1; padding:14px; border-radius:12px; border:1px solid var(--border); background:var(--panel-2); color:var(--text); font-size:14px; font-weight:700;}
  .btn.finalize{background:linear-gradient(180deg,#4a2320,#3a1a18); border-color:var(--danger); color:#ff8f86;}
  .btn.finalize:disabled{opacity:0.4;}
  .btn.undo{color:var(--muted);}
  .btn.confirm{background:linear-gradient(180deg,#1e3327,#182a20); border-color:var(--teiji); color:var(--teiji);}

  .finalize-panel{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px; margin-top:16px;}
  .mode-toggle{display:flex; gap:10px; margin-bottom:12px;}
  .mode-btn{flex:1; padding:12px; border-radius:10px; border:2px solid var(--border); background:var(--panel-2); color:var(--muted); font-weight:700; font-size:14px;}
  .mode-btn.selected{border-color:var(--amber); color:var(--amber); background:var(--amber-dim);}
  .zangyo-input-row{display:none; align-items:center; gap:10px; margin-bottom:12px;}
  .zangyo-input-row.visible{display:flex;}
  .zangyo-input-row label{font-size:13px; color:var(--muted); flex:1;}
  .zangyo-input-row input{width:90px; padding:10px; border-radius:9px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:16px; text-align:center;}

  .finalized-banner{background:linear-gradient(180deg,#1e3327,#182a20); border:1px solid var(--teiji); color:var(--teiji);
    border-radius:12px; padding:12px 14px; font-size:13px; margin-top:16px; text-align:center; font-weight:600;}

  .status-msg{margin-top:10px; padding:10px 12px; border-radius:10px; font-size:13px; text-align:center; font-weight:600;
    background:rgba(95,184,143,0.12); color:var(--teiji); border:1px solid var(--teiji);}
  .status-msg.error{background:rgba(217,82,74,0.12); color:#ff8f86; border-color:var(--danger);}

  .tabs{display:flex; gap:8px; margin-top:14px;}
  .tab-btn{flex:1; padding:10px; border-radius:10px; border:1px solid var(--border);
    background:var(--panel); color:var(--muted); font-size:14px; font-weight:600;}
  .tab-btn.active{background:var(--amber-dim); color:var(--amber); border-color:var(--amber);}
  .history-item{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px 14px;
    display:flex; justify-content:space-between; align-items:center; font-size:14px; margin-bottom:8px;}
  .history-item .badge{font-size:10px; padding:3px 7px; border-radius:6px; font-weight:700;}
  .badge.done{background:rgba(95,184,143,0.15); color:var(--teiji);}
  .badge.open{background:rgba(240,165,55,0.15); color:var(--amber);}
  .back-link{color:var(--amber); font-size:13px; font-weight:600; margin-bottom:12px; display:inline-block;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-row">
      <div>
        <div class="clock" id="clock">--:--:--</div>
        <div class="date-line" id="dateLine">—</div>
      </div>
      <button class="reset-btn" id="resetBtn">Início do dia</button>
    </div>
    <div class="tabs">
      <button class="tab-btn active" id="tabToday">Hoje</button>
      <button class="tab-btn" id="tabHistory">Histórico</button>
    </div>
  </header>

  <main>
    <section id="view-history" hidden>
      <div id="historyList"></div>
    </section>

    <section id="view-today">
    <div class="section-label">Estação atual</div>
    <div class="stations-grid" id="stationsGrid"></div>

    <div class="status-card">
      <div class="status-row">
        <span class="label">Trabalhando em</span>
        <span class="value" id="currentStationVal">—</span>
      </div>
      <div class="status-sub" id="sinceVal">Selecione uma estação para começar</div>
    </div>

    <div class="finalize-panel" id="selectConfirmPanel" hidden>
      <div id="selectConfirmText" style="font-size:14.5px; margin-bottom:14px;"></div>
      <div class="actions" style="margin-top:0;">
        <button class="btn" id="cancelSelectBtn">Cancelar</button>
        <button class="btn confirm" id="confirmSelectBtn">Confirmar</button>
      </div>
    </div>

    <div id="finalizedBanner" class="finalized-banner" hidden></div>

    <div class="section-label">Registros de hoje</div>
    <div class="events-list" id="eventsList"></div>

    <div class="section-label" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <span>Totais de hoje</span>
      <button class="reset-btn" id="editTimesBtn" style="text-transform:none; letter-spacing:0; padding:6px 10px; font-size:11.5px;">Ajustar horários</button>
    </div>
    <table class="totals">
      <thead><tr><th>Estação</th><th>Teiji</th><th>Zangyo</th><th>Total</th></tr></thead>
      <tbody id="totalsBody"></tbody>
    </table>
    <div id="adjustHint" style="font-size:12px; color:var(--muted); margin-top:8px;" hidden></div>
    <div class="actions" id="adjustActions" style="margin-top:10px;" hidden>
      <button class="btn" id="cancelAdjustBtn">Cancelar</button>
      <button class="btn confirm" id="saveAdjustBtn">Salvar ajustes</button>
    </div>

    <div class="actions">
      <button class="btn undo" id="undoBtn">Desfazer última</button>
      <button class="btn finalize" id="finalizeBtn">Finalizar serviço</button>
    </div>

    <div class="finalize-panel" id="finalizePanel" hidden>
      <div class="section-label" style="margin-top:0;">Como foi hoje?</div>
      <div class="mode-toggle">
        <button class="mode-btn selected" id="modeTeijiBtn">Teiji (sem hora extra)</button>
        <button class="mode-btn" id="modeZangyoBtn">Com zangyo</button>
      </div>
      <div class="zangyo-input-row" id="zangyoInputRow">
        <label for="zangyoHoursInput">Quantas horas de zangyo?</label>
        <input type="number" id="zangyoHoursInput" step="0.25" min="0" value="1">
      </div>
      <div class="actions" style="margin-top:0;">
        <button class="btn" id="cancelFinalizeBtn">Cancelar</button>
        <button class="btn confirm" id="confirmFinalizeBtn">Confirmar finalização</button>
      </div>
    </div>

    <div id="statusMsg" class="status-msg" hidden></div>
    </section>
  </main>
</div>

<script>
const STATIONS = ['1','2','3A','3B','4'];
const STATION_LABELS = { '1':'静電', '2':'電着', '3A':'修正', '3B':'全検', '4':'そのほか' };
function labelFor(s){ return STATION_LABELS[s] || s; }
const BREAKS = [
  ['09:00','09:10'],
  ['11:20','12:00'],
  ['14:00','14:10'],
  ['15:30','15:40'],
];
const TEIJI_END = '15:30';
const ZANGYO_START = '15:40';
const DAY_START = '06:30';

function pad2(n){ return String(n).padStart(2,'0'); }
function dateKeyOf(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function timeOnDate(dayKey, hhmm){
  const [y,mo,da] = dayKey.split('-').map(Number);
  const [h,mi] = hhmm.split(':').map(Number);
  return new Date(y, mo-1, da, h, mi, 0, 0);
}
function fmtClock(d){ return pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds()); }
function fmtHM(d){ return pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function fmtDur(ms){
  if(ms<0) ms=0;
  const totalMin = Math.round(ms/60000);
  const h = Math.floor(totalMin/60);
  const m = totalMin%60;
  const decimal = parseFloat((ms/3600000).toFixed(2)).toString();
  return h+':'+pad2(m)+'/'+decimal;
}
function fmtElapsed(ms){
  if(ms<0) ms=0;
  const totalSec = Math.floor(ms/1000);
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  if(h>0) return h+'h ' + pad2(m) + 'min';
  if(m>0) return m + 'min ' + pad2(s) + 's';
  return s + 's';
}
function fmtDateHuman(dayKey){
  const [y,mo,da] = dayKey.split('-').map(Number);
  const d = new Date(y, mo-1, da);
  const dias = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
  return pad2(da)+'/'+pad2(mo)+'/'+y+' · '+dias[d.getDay()];
}

function computeTotals(dayKey, events, endTime){
  const totals = {};
  STATIONS.forEach(s => totals[s] = {teiji:0, zangyo:0});
  const breakIntervals = BREAKS.map(([s,e]) => [timeOnDate(dayKey,s), timeOnDate(dayKey,e)]);
  const teijiEnd = timeOnDate(dayKey, TEIJI_END);

  for(let i=0;i<events.length;i++){
    const start = new Date(events[i].time);
    const end = i+1 < events.length ? new Date(events[i+1].time) : endTime;
    if(!(end > start)) continue;
    const station = events[i].station;
    if(!totals[station]) totals[station] = {teiji:0, zangyo:0};

    let segments = [[start, end]];
    for(const [bs,be] of breakIntervals){
      const next = [];
      for(const [s,e] of segments){
        if(be <= s || bs >= e){ next.push([s,e]); continue; }
        if(bs > s) next.push([s, new Date(Math.min(bs.getTime(), e.getTime()))]);
        if(be < e) next.push([new Date(Math.max(be.getTime(), s.getTime())), e]);
      }
      segments = next.filter(([s,e]) => e > s);
    }

    for(const [s,e] of segments){
      if(e <= teijiEnd){
        totals[station].teiji += (e - s);
      } else if(s >= teijiEnd){
        totals[station].zangyo += (e - s);
      } else {
        totals[station].teiji += (teijiEnd - s);
        totals[station].zangyo += (e - teijiEnd);
      }
    }
  }
  return totals;
}

// aplica os ajustes manuais (por estação, teiji/zangyo) por cima dos totais reais calculados a partir dos registros
function getTotalsFor(dd){
  let endTime;
  if(dd.finalized){
    endTime = new Date(dd.finalizedAt);
  } else if(dd.date === today){
    endTime = new Date(); // dia de hoje, ainda em andamento — usa o relógio atual
  } else {
    // dia antigo que nunca foi finalizado: não sabemos quando terminou de verdade,
    // então não conta o último serviço como se estivesse em andamento até agora
    endTime = dd.events.length ? new Date(dd.events[dd.events.length-1].time) : timeOnDate(dd.date, DAY_START);
  }
  const raw = computeTotals(dd.date, dd.events, endTime);
  const totals = {};
  STATIONS.forEach(s => {
    const adj = (dd.adjustments && dd.adjustments[s]) || {teiji:0, zangyo:0};
    totals[s] = { teiji: raw[s].teiji + (adj.teiji||0), zangyo: raw[s].zangyo + (adj.zangyo||0) };
  });
  return totals;
}
function getAdjustedTotals(){
  return getTotalsFor(dayData);
}

let today = dateKeyOf(new Date());
let dayData = { date: today, events: [], finalized:false, finalizedAt:null, finalizeMode:null, zangyoHours:null, adjustments:{} };

const el = {
  clock: document.getElementById('clock'),
  dateLine: document.getElementById('dateLine'),
  stationsGrid: document.getElementById('stationsGrid'),
  currentStationVal: document.getElementById('currentStationVal'),
  sinceVal: document.getElementById('sinceVal'),
  eventsList: document.getElementById('eventsList'),
  totalsBody: document.getElementById('totalsBody'),
  adjustHint: document.getElementById('adjustHint'),
  adjustActions: document.getElementById('adjustActions'),
  cancelAdjustBtn: document.getElementById('cancelAdjustBtn'),
  saveAdjustBtn: document.getElementById('saveAdjustBtn'),
  finalizeBtn: document.getElementById('finalizeBtn'),
  undoBtn: document.getElementById('undoBtn'),
  finalizedBanner: document.getElementById('finalizedBanner'),
  resetBtn: document.getElementById('resetBtn'),
  finalizePanel: document.getElementById('finalizePanel'),
  modeTeijiBtn: document.getElementById('modeTeijiBtn'),
  modeZangyoBtn: document.getElementById('modeZangyoBtn'),
  zangyoInputRow: document.getElementById('zangyoInputRow'),
  zangyoHoursInput: document.getElementById('zangyoHoursInput'),
  cancelFinalizeBtn: document.getElementById('cancelFinalizeBtn'),
  confirmFinalizeBtn: document.getElementById('confirmFinalizeBtn'),
  statusMsg: document.getElementById('statusMsg'),
  tabToday: document.getElementById('tabToday'),
  tabHistory: document.getElementById('tabHistory'),
  viewToday: document.getElementById('view-today'),
  viewHistory: document.getElementById('view-history'),
  historyList: document.getElementById('historyList'),
  selectConfirmPanel: document.getElementById('selectConfirmPanel'),
  selectConfirmText: document.getElementById('selectConfirmText'),
  cancelSelectBtn: document.getElementById('cancelSelectBtn'),
  confirmSelectBtn: document.getElementById('confirmSelectBtn'),
};

let statusTimer = null;
function showStatus(msg, isError){
  el.statusMsg.textContent = msg;
  el.statusMsg.classList.toggle('error', !!isError);
  el.statusMsg.hidden = false;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { el.statusMsg.hidden = true; }, 5000);
}

STATIONS.forEach(s => {
  const b = document.createElement('button');
  b.className = 'station-btn';
  b.dataset.station = s;
  b.innerHTML = labelFor(s) + '<small>' + s + '</small>';
  b.addEventListener('click', () => selectStation(s));
  el.stationsGrid.appendChild(b);
});

function loadDay(){
  today = dateKeyOf(new Date());
  dayData = { date: today, events: [], finalized:false, finalizedAt:null, finalizeMode:null, zangyoHours:null, adjustments:{} };
  try{
    const raw = localStorage.getItem('day:'+today);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.date === today) dayData = parsed;
    }
  }catch(e){
    showStatus('Este navegador não está permitindo salvar dados aqui (talvez aba anônima). Use uma aba normal.', true);
  }
  render();
}

function saveDay(){
  try{
    localStorage.setItem('day:'+dayData.date, JSON.stringify(dayData));
  }catch(e){
    showStatus('Não consegui salvar os dados agora neste navegador.', true);
  }
}

let pendingStation = null;

const LUNCH_START = '11:20';
const LUNCH_END = '12:00';

function computeEventTime(){
  if(dayData.events.length === 0){
    return { time: timeOnDate(today, DAY_START), afterLunch:false };
  }
  const last = dayData.events[dayData.events.length-1];
  const lastTime = new Date(last.time);
  const lunchStart = timeOnDate(today, LUNCH_START);
  if(lastTime < lunchStart && new Date() >= lunchStart){
    return { time: timeOnDate(today, LUNCH_END), afterLunch:true };
  }
  return { time: new Date(), afterLunch:false };
}

function selectStation(station){
  if(dayData.finalized) return;
  const last = dayData.events[dayData.events.length-1];
  const { afterLunch } = computeEventTime();
  if(last && last.station === station && !afterLunch) return; // já está nessa estação (fora da retomada do almoço)
  pendingStation = station;
  el.selectConfirmText.textContent = afterLunch
    ? 'Você vai retomar o serviço em ' + labelFor(station) + ' às 12:00 (volta do almoço).'
    : 'Você vai começar a trabalhar em ' + labelFor(station) + '.';
  el.selectConfirmPanel.hidden = false;
  updatePendingHighlight();
}

function cancelSelect(){
  pendingStation = null;
  el.selectConfirmPanel.hidden = true;
  updatePendingHighlight();
}

function confirmSelect(){
  if(!pendingStation) return;
  const station = pendingStation;
  const { time } = computeEventTime();
  dayData.events.push({ station, time: time.toISOString() });
  pendingStation = null;
  el.selectConfirmPanel.hidden = true;
  saveDay();
  render();
}

function updatePendingHighlight(){
  document.querySelectorAll('.station-btn').forEach(btn => {
    btn.classList.toggle('pending', btn.dataset.station === pendingStation);
  });
}

el.cancelSelectBtn.addEventListener('click', cancelSelect);
el.confirmSelectBtn.addEventListener('click', confirmSelect);

function undoLast(){
  if(dayData.finalized || dayData.events.length===0) return;
  dayData.events.pop();
  saveDay();
  render();
}

let resetArmed = false;
async function resetDay(){
  if(!resetArmed){
    resetArmed = true;
    el.resetBtn.textContent = 'Confirmar apagar?';
    showStatus('Toque em "Confirmar apagar?" de novo para apagar os registros de hoje.', true);
    setTimeout(() => {
      if(resetArmed){ resetArmed = false; el.resetBtn.textContent = 'Início do dia'; }
    }, 5000);
    return;
  }
  resetArmed = false;
  el.resetBtn.textContent = 'Início do dia';
  dayData = { date: today, events: [], finalized:false, finalizedAt:null, finalizeMode:null, zangyoHours:null, adjustments:{} };
  closeFinalizePanel();
  await saveDay();
  render();
  showStatus('Novo dia iniciado.');
}

let selectedMode = 'teiji';

function openFinalizePanel(){
  if(dayData.finalized) return;
  if(dayData.events.length===0){
    showStatus('Selecione ao menos uma estação antes de finalizar.', true);
    return;
  }
  selectedMode = 'teiji';
  updateModeButtons();
  el.finalizePanel.hidden = false;
}
function closeFinalizePanel(){
  el.finalizePanel.hidden = true;
}
function updateModeButtons(){
  el.modeTeijiBtn.classList.toggle('selected', selectedMode === 'teiji');
  el.modeZangyoBtn.classList.toggle('selected', selectedMode === 'zangyo');
  el.zangyoInputRow.classList.toggle('visible', selectedMode === 'zangyo');
}
el.modeTeijiBtn.addEventListener('click', () => { selectedMode = 'teiji'; updateModeButtons(); });
el.modeZangyoBtn.addEventListener('click', () => { selectedMode = 'zangyo'; updateModeButtons(); });
el.cancelFinalizeBtn.addEventListener('click', closeFinalizePanel);

async function confirmFinalize(){
  let endTime, zangyoHours = null;
  if(selectedMode === 'teiji'){
    endTime = timeOnDate(today, TEIJI_END);
  } else {
    const hours = parseFloat(el.zangyoHoursInput.value);
    if(isNaN(hours) || hours < 0){
      showStatus('Digite uma quantidade de horas válida.', true);
      return;
    }
    zangyoHours = hours;
    const zangyoStart = timeOnDate(today, ZANGYO_START);
    endTime = new Date(zangyoStart.getTime() + hours*3600000);
  }
  dayData.finalized = true;
  dayData.finalizedAt = endTime.toISOString();
  dayData.finalizeMode = selectedMode;
  dayData.zangyoHours = zangyoHours;
  closeFinalizePanel();
  saveDay();
  render();
}
el.confirmFinalizeBtn.addEventListener('click', confirmFinalize);

function renderEventsList(){
  el.eventsList.innerHTML = '';
  if(dayData.events.length === 0 && !dayData.finalized){
    el.eventsList.innerHTML = '<div class="empty-msg">Nenhum registro ainda hoje.</div>';
    return;
  }
  dayData.events.forEach(ev => {
    const row = document.createElement('div');
    row.className = 'event-row';
    row.innerHTML = '<span class="ev-station">' + labelFor(ev.station) + '</span><span class="ev-time">' + fmtHM(new Date(ev.time)) + '</span>';
    el.eventsList.appendChild(row);
  });
  if(dayData.finalized){
    const row = document.createElement('div');
    row.className = 'event-row ev-final';
    const label = dayData.finalizeMode === 'zangyo' ? ('Finalizado (zangyo +' + dayData.zangyoHours + 'h)') : 'Finalizado (teiji)';
    row.innerHTML = '<span class="ev-station">' + label + '</span><span class="ev-time">' + fmtHM(new Date(dayData.finalizedAt)) + '</span>';
    el.eventsList.appendChild(row);
  }
}

let adjustMode = false;

function openAdjustPanel(){
  if(dayData.events.length === 0){
    showStatus('Ainda não há registros hoje para ajustar.', true);
    return;
  }
  adjustMode = true;
  document.getElementById('editTimesBtn').textContent = 'Fechar ajuste';
  el.adjustHint.hidden = false;
  el.adjustHint.textContent = 'Ordem fixa: 1 → 2 → 3A → 3B → 4. Teiji e zangyo são grupos independentes — cada um pula estações zeradas naquela categoria ao procurar a próxima pra compensar. Nunca mexe no horário final.';
  el.adjustActions.hidden = false;
  render();
}
function closeAdjustPanel(){
  adjustMode = false;
  document.getElementById('editTimesBtn').textContent = 'Ajustar horários';
  el.adjustHint.hidden = true;
  el.adjustActions.hidden = true;
  render();
}
el.cancelAdjustBtn.addEventListener('click', closeAdjustPanel);
el.saveAdjustBtn.addEventListener('click', saveAdjustPanel);

function readCategoryInput(category, station){
  const hInput = el.totalsBody.querySelector('.'+category+'-h-input[data-station="'+station+'"]');
  const mInput = el.totalsBody.querySelector('.'+category+'-m-input[data-station="'+station+'"]');
  if(!hInput || !mInput) return null; // estação não exibida (sem horas hoje) — nada a ler
  const h = parseInt(hInput.value, 10), m = parseInt(mInput.value, 10);
  if(isNaN(h) || isNaN(m) || h < 0 || m < 0 || m > 59) return NaN; // exibida mas com valor inválido
  return h*3600000 + m*60000;
}

function saveAdjustPanel(){
  const currentTotals = getAdjustedTotals(); // fonte de verdade dos valores atuais, exibidos ou não
  const draft = JSON.parse(JSON.stringify(dayData.adjustments || {})); // rascunho — só aplica em dayData se tudo validar
  let errorMsg = null;
  // arredonda pra minuto cheio (igual ao que é mostrado nos campos h/min), senão sobras de segundos
  // fariam o sistema achar que um campo "mudou" mesmo sem o usuário ter mexido nele
  const roundToMinute = ms => Math.floor(ms/60000)*60000;

  ['teiji','zangyo'].forEach(category => {
    if(errorMsg) return;
    const origValues = STATIONS.map(s => roundToMinute(currentTotals[s][category]));

    for(let i = 0; i < STATIONS.length; i++){
      const s = STATIONS[i];
      const read = readCategoryInput(category, s);
      if(read === null) continue; // estação não exibida: nada pra editar aqui
      if(Number.isNaN(read)){ errorMsg = 'Preencha horas e minutos válidos em todos os campos.'; break; }
      if(read === origValues[i]) continue; // não mexido: não cascateia
      const delta = read - origValues[i];
      if(!draft[s]) draft[s] = {teiji:0, zangyo:0};
      draft[s][category] = (draft[s][category]||0) + delta;

      // acha a próxima estação da lista com horas nessa categoria (pulando as zeradas)
      let targetIdx = -1;
      for(let j = i+1; j < STATIONS.length; j++){
        if(origValues[j] !== 0){ targetIdx = j; break; }
      }
      if(targetIdx !== -1){
        const next = STATIONS[targetIdx];
        if(!draft[next]) draft[next] = {teiji:0, zangyo:0};
        draft[next][category] = (draft[next][category]||0) - delta;
      }
      // se não houver nenhuma estação seguinte com horas nessa categoria, a diferença não tem para onde ir
    }
  });

  if(errorMsg){ showStatus(errorMsg, true); return; }

  const draftTotals = getTotalsFor(Object.assign({}, dayData, { adjustments: draft }));
  const hasNegative = STATIONS.some(s => draftTotals[s].teiji < 0 || draftTotals[s].zangyo < 0);
  if(hasNegative){
    showStatus('Esse ajuste deixaria alguma estação com horas negativas. Tente valores menores.', true);
    return;
  }

  dayData.adjustments = draft;
  closeAdjustPanel();
  saveDay();
  render();
  showStatus('Ajustado — a diferença foi compensada na próxima estação da lista.');
}

function updateElapsedDisplay(){
  if(dayData.finalized){
    el.sinceVal.textContent = 'Serviço encerrado';
    return;
  }
  const lastEvent = dayData.events[dayData.events.length-1];
  if(!lastEvent){
    el.sinceVal.textContent = 'Selecione uma estação para começar';
    return;
  }
  const elapsed = Date.now() - new Date(lastEvent.time).getTime();
  el.sinceVal.textContent = fmtElapsed(elapsed) + ' nesta estação';
}

function durationInputPair(category, station, ms){
  const h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000);
  return '<span style="display:inline-flex; align-items:center; gap:2px;">' +
    '<input type="number" class="'+category+'-h-input mini-duration-input" data-station="'+station+'" min="0" value="'+h+'">' +
    '<span style="font-size:10px; color:var(--muted);">h</span>' +
    '<input type="number" class="'+category+'-m-input mini-duration-input" data-station="'+station+'" min="0" max="59" value="'+m+'">' +
    '<span style="font-size:10px; color:var(--muted);">m</span></span>';
}

function appendTotalsRow(label, t, station, extraClass){
  const tr = document.createElement('tr');
  if(extraClass) tr.className = extraClass;
  if(adjustMode && station){
    tr.innerHTML = '<td class="station-cell">' + label + '</td>' +
      '<td>' + durationInputPair('teiji', station, t.teiji) + '</td>' +
      '<td>' + durationInputPair('zangyo', station, t.zangyo) + '</td>' +
      '<td class="total-cell">' + fmtDur(t.teiji + t.zangyo) + '</td>';
  } else {
    tr.innerHTML = '<td class="station-cell">' + label + '</td>' +
      '<td class="teiji-cell">' + fmtDur(t.teiji) + '</td>' +
      '<td class="zangyo-cell">' + fmtDur(t.zangyo) + '</td>' +
      '<td class="total-cell">' + fmtDur(t.teiji + t.zangyo) + '</td>';
  }
  return tr;
}

function renderTotalsTable(totals){
  el.totalsBody.innerHTML = '';
  let grandT = 0, grandZ = 0, anyRow = false;
  STATIONS.forEach(s => {
    const t = totals[s] || {teiji:0, zangyo:0};
    grandT += t.teiji; grandZ += t.zangyo;
    if(t.teiji === 0 && t.zangyo === 0) return; // oculta estações sem horas registradas hoje (também durante o ajuste)
    anyRow = true;
    el.totalsBody.appendChild(appendTotalsRow(labelFor(s), t, s));
  });
  const t3a = totals['3A'] || {teiji:0, zangyo:0};
  const t3b = totals['3B'] || {teiji:0, zangyo:0};
  const combined = { teiji: t3a.teiji + t3b.teiji, zangyo: t3a.zangyo + t3b.zangyo };
  if(!adjustMode && (combined.teiji > 0 || combined.zangyo > 0)){
    el.totalsBody.appendChild(appendTotalsRow(labelFor('3A') + ' + ' + labelFor('3B'), combined, null, 'subtotal'));
  }
  if(!anyRow){
    const tr = document.createElement('tr');
    tr.innerHTML = '<td colspan="4" style="text-align:center; color:var(--muted); padding:14px 8px; border-bottom:none;">Nenhuma hora registrada ainda</td>';
    el.totalsBody.appendChild(tr);
    return;
  }
  const grandTr = document.createElement('tr');
  grandTr.className = 'grand';
  grandTr.innerHTML = '<td class="station-cell">Total</td>' +
    '<td class="teiji-cell">' + fmtDur(grandT) + '</td>' +
    '<td class="zangyo-cell">' + fmtDur(grandZ) + '</td>' +
    '<td class="total-cell">' + fmtDur(grandT + grandZ) + '</td>';
  el.totalsBody.appendChild(grandTr);
}

function render(){
  el.dateLine.textContent = fmtDateHuman(dayData.date);

  const lastEvent = dayData.events[dayData.events.length-1];
  const activeStation = lastEvent ? lastEvent.station : null;

  document.querySelectorAll('.station-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.station === activeStation && !dayData.finalized);
    btn.disabled = dayData.finalized || adjustMode;
  });
  updatePendingHighlight();

  if(dayData.finalized){
    el.currentStationVal.textContent = '—';
    el.finalizedBanner.hidden = false;
    const modeLabel = dayData.finalizeMode === 'zangyo' ? ('zangyo de ' + dayData.zangyoHours + 'h') : 'teiji';
    el.finalizedBanner.textContent = 'Serviço finalizado (' + modeLabel + ') às ' + fmtHM(new Date(dayData.finalizedAt)) + '.';
    el.finalizeBtn.disabled = true;
    el.undoBtn.disabled = true;
  } else {
    el.finalizedBanner.hidden = true;
    el.finalizeBtn.disabled = adjustMode;
    el.undoBtn.disabled = dayData.events.length === 0 || adjustMode;
    el.currentStationVal.textContent = activeStation || '—';
  }
  updateElapsedDisplay();

  renderEventsList();

  renderTotalsTable(getAdjustedTotals());
}

function tickClock(){
  const now = new Date();
  el.clock.textContent = fmtClock(now);
  if(dateKeyOf(now) !== dayData.date){
    loadDay();
  } else if(!dayData.finalized){
    renderTotalsTable(getAdjustedTotals());
    updateElapsedDisplay();
  }
}
setInterval(tickClock, 1000);

el.finalizeBtn.addEventListener('click', openFinalizePanel);
el.undoBtn.addEventListener('click', undoLast);
el.resetBtn.addEventListener('click', resetDay);
document.getElementById('editTimesBtn').addEventListener('click', () => {
  if(adjustMode){
    closeAdjustPanel();
  } else {
    openAdjustPanel();
  }
});

function totalsTableHTML(totals){
  let grandT = 0, grandZ = 0, rows = '';
  STATIONS.forEach(s => {
    const t = totals[s] || {teiji:0, zangyo:0};
    grandT += t.teiji; grandZ += t.zangyo;
    if(t.teiji === 0 && t.zangyo === 0) return;
    rows += '<tr><td class="station-cell">' + labelFor(s) + '</td>' +
      '<td class="teiji-cell">' + fmtDur(t.teiji) + '</td>' +
      '<td class="zangyo-cell">' + fmtDur(t.zangyo) + '</td>' +
      '<td class="total-cell">' + fmtDur(t.teiji + t.zangyo) + '</td></tr>';
  });
  const t3a = totals['3A'] || {teiji:0, zangyo:0};
  const t3b = totals['3B'] || {teiji:0, zangyo:0};
  const combined = { teiji: t3a.teiji + t3b.teiji, zangyo: t3a.zangyo + t3b.zangyo };
  if(combined.teiji > 0 || combined.zangyo > 0){
    rows += '<tr class="subtotal"><td class="station-cell">' + labelFor('3A') + ' + ' + labelFor('3B') + '</td>' +
      '<td class="teiji-cell">' + fmtDur(combined.teiji) + '</td>' +
      '<td class="zangyo-cell">' + fmtDur(combined.zangyo) + '</td>' +
      '<td class="total-cell">' + fmtDur(combined.teiji + combined.zangyo) + '</td></tr>';
  }
  rows += '<tr class="grand"><td class="station-cell">Total</td>' +
    '<td class="teiji-cell">' + fmtDur(grandT) + '</td>' +
    '<td class="zangyo-cell">' + fmtDur(grandZ) + '</td>' +
    '<td class="total-cell">' + fmtDur(grandT + grandZ) + '</td></tr>';
  return '<table class="totals"><thead><tr><th>Estação</th><th>Teiji</th><th>Zangyo</th><th>Total</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

function listDayKeys(){
  const keys = [];
  for(let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if(k && k.startsWith('day:') && k !== 'day:'+today) keys.push(k);
  }
  return keys.sort().reverse();
}

function loadHistoryList(){
  const keys = listDayKeys();
  if(keys.length === 0){
    el.historyList.innerHTML = '<div class="empty-msg">Nenhum dia anterior registrado ainda.</div>';
    return;
  }
  el.historyList.innerHTML = '';
  keys.forEach(key => {
    const dayKey = key.replace('day:','');
    let dd;
    try{ dd = JSON.parse(localStorage.getItem(key)); }catch(e){ return; }
    if(!dd) return;
    const item = document.createElement('div');
    item.className = 'history-item';
    const badge = dd.finalized ? '<span class="badge done">finalizado</span>' : '<span class="badge open">em aberto</span>';
    item.innerHTML = '<span>' + fmtDateHuman(dayKey) + '</span>' + badge;
    item.addEventListener('click', () => showHistoryDetail(dayKey, dd));
    el.historyList.appendChild(item);
  });
}

function showHistoryDetail(dayKey, dd){
  const totals = getTotalsFor(dd);
  el.historyList.innerHTML = '<a class="back-link" id="historyBack">&larr; Voltar ao histórico</a>' +
    '<div class="section-label" style="margin-top:0;">' + fmtDateHuman(dayKey) + (dd.finalized ? ' · finalizado' : ' · em aberto') + '</div>' +
    totalsTableHTML(totals);
  document.getElementById('historyBack').addEventListener('click', (e) => { e.preventDefault(); loadHistoryList(); });
}

el.tabToday.addEventListener('click', () => {
  el.tabToday.classList.add('active');
  el.tabHistory.classList.remove('active');
  el.viewToday.hidden = false;
  el.viewHistory.hidden = true;
});
el.tabHistory.addEventListener('click', () => {
  el.tabHistory.classList.add('active');
  el.tabToday.classList.remove('active');
  el.viewToday.hidden = true;
  el.viewHistory.hidden = false;
  loadHistoryList();
});

loadDay();
</script>
</body>
